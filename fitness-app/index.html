<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
  <h2 style="text-align:center;">เข้าสู่ระบบ</h2>
  <div style="text-align:center;">
    <input type="email" id="loginEmail" placeholder="Email"><br><br>
    <input type="password" id="loginPassword" placeholder="Password"><br><br>
    <button id="loginBtn">ตกลง</button><br><br>
    <a href="register.html">สมัครสมาชิก</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBRXqmB33Alumlgxb6OEHNdJ5L_5B4ha5A",
      authDomain: "game-killer-82700.firebaseapp.com",
      projectId: "game-killer-82700",
      storageBucket: "game-killer-82700.firebasestorage.app",
      messagingSenderId: "1020819084097",
      appId: "1:1020819084097:web:05b76622dd6bae2d25c7c0",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("loginBtn").addEventListener("click", () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("เข้าสู่ระบบสำเร็จ!");
          window.location.href = "home.html";
        })
        .catch((error) => {
          alert("ผิดพลาด: " + error.message);
        });
    });
  </script>
</body>
</html>
