<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าหลัก</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="home-container">
        <div class="left-panel">
            
            <div class="profile-section">
                <img id="profile-pic" src="https://via.placeholder.com/150" alt="Profile Picture">
                <input type="file" id="file-upload" accept="image/*">
                <label for="file-upload" class="btn-upload">เลือกรูปโปรไฟล์</label>
                <h3 id="username-display">Loading...</h3>
            </div>
            
            <div class="info-section">
                <h4>ข้อมูลของคุณ</h4>
                <form id="user-info-form">
                    <input type="number" id="weight" placeholder="น้ำหนัก (kg)">
                    <input type="number" id="height" placeholder="ส่วนสูง (cm)">
                    <select id="gender">
                        <option value="male">ชาย</option>
                        <option value="female">หญิง</option>
                    </select>
                    <input type="number" id="age" placeholder="อายุ (ปี)">
                    <button type="submit" class="btn">บันทึกและคำนวณ</button>
                </form>
                <div class="result-box">
                    <p>BMI ของคุณ: <strong id="bmi-result">-</strong></p>
                </div>
            </div>

            <button id="logout-button" class="btn btn-danger">ออกจากระบบ</button>

        </div>

        <div class="main-content">
    
            <div class="calories-display">
                <h2>แคลอรี่พื้นฐานที่ต้องใช้ต่อวัน (เพื่อรักษาน้ำหนัก)</h2>
                <p id="maintenance-calories-result">-</p>
            </div>

            <div class="goal-setter-container">
                <h3>ตั้งเป้าหมายของคุณ</h3>
                <form id="goal-setter-form">
                    <div class="form-group">
                        <label for="target-weight">น้ำหนักที่ต้องการ (kg)</label>
                        <input type="number" id="target-weight" required>
                    </div>
                    <div class="form-group">
                        <label for="target-date">ภายในวันที่</label>
                        <input type="date" id="target-date" required>
                    </div>
                    <button type="submit" class="btn">คำนวณแคลอรี่ตามเป้าหมาย</button>
                </form>
            </div>
            
            <div id="goal-calories-display" class="calories-display goal-result" style="display: none;">
                <h2>คุณควรกินวันละ</h2>
                <p id="goal-calories-result">-</p>
                <small id="goal-message"></small>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
