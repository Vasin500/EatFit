<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
</head>
<body>
  <h2 style="text-align:center;">สมัครสมาชิก</h2>
  <div style="text-align:center;">
    <input type="email" id="regEmail" placeholder="Email"><br><br>
    <input type="text" id="regUsername" placeholder="Username"><br><br>
    <input type="password" id="regPassword" placeholder="Password"><br><br>
    <button id="registerBtn">ตกลง</button><br><br>
    <a href="index.html">ล็อกอิน</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBRXqmB33Alumlgxb6OEHNdJ5L_5B4ha5A",
      authDomain: "game-killer-82700.firebaseapp.com",
      projectId: "game-killer-82700",
      storageBucket: "game-killer-82700.firebasestorage.app",
      messagingSenderId: "1020819084097",
      appId: "1:1020819084097:web:05b76622dd6bae2d25c7c0",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("registerBtn").addEventListener("click", () => {
      const email = document.getElementById("regEmail").value;
      const username = document.getElementById("regUsername").value;
      const password = document.getElementById("regPassword").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          updateProfile(userCredential.user, { displayName: username });
          alert("สมัครสมาชิกสำเร็จ!");
          window.location.href = "home.html";
        })
        .catch((error) => {
          alert("ผิดพลาด: " + error.message);
        });
    });
  </script>
</body>
</html>
